name: tubegrow
description: "TubeTool: Modern YouTube content creator toolkit & AI studio."
publish_to: 'none'

version: 21.21.21+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.5.3
  dio: ^5.9.0
  youtube_data_api: ^1.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  permission_handler: ^12.0.0
  intl: ^0.20.2
  timeago: ^3.6.1
  connectivity_plus: ^6.0.3
  image_gallery_saver_plus: ^4.0.1
  image_picker: ^1.1.2
  flutter_dotenv: ^5.1.0
  flutter_staggered_grid_view: ^0.7.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

dependency_overrides:
  http: ^1.2.0
